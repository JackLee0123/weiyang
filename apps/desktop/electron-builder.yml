appId: com.planner.desktop
productName: 计划表
directories:
  output: release
files:
  - dist/**/*
  - package.json
extraResources:
  - from: ../frontend/dist
    to: frontend
  - from: resources/backend
    to: backend
    filter:
      - "**/*"
  - from: resources/mariadb
    to: mariadb
    filter:
      - "**/*"
asar: true
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
