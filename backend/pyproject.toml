[project]
name = "planner-backend"
version = "0.4.0"
description = "本地任务计划客户端后端：FastAPI + SQLAlchemy + MySQL/MariaDB"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "pymysql>=1.1",
  "alembic>=1.14",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
