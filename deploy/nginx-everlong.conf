# 未央 · Everlong 生产环境 HTTPS 反向代理配置示例。
# 生产域名：everlong.net.cn（含 www）。证书用 certbot 签发后会自动写入。
# 后端监听地址若不同，请同步修改下文的 proxy_pass 目标端口。

server {
    listen 80;
    server_name everlong.net.cn www.everlong.net.cn;
    # 全站跳转 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name everlong.net.cn www.everlong.net.cn;

    ssl_certificate     /etc/letsencrypt/live/everlong.net.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/everlong.net.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # 强制浏览器使用 HTTPS
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
